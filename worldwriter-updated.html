<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Worldwriter</title>
<style>
:root{--bg:#05060f;--panel:#0f1220;--ink:#e9e6f5;--mute:#8d8aa6;--line:#262a42;--acc:#9b8cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.bar{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px;flex-wrap:wrap;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
h1{font:600 18px Georgia,serif;margin:0 8px 0 2px;letter-spacing:.3px}
button{background:#1a1e33;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.main{background:var(--acc);color:#10102a;border-color:var(--acc);font-weight:600}
#coord{position:fixed;left:12px;bottom:10px;color:var(--mute);font-size:12px;z-index:5}
#panel{position:fixed;right:12px;bottom:12px;top:64px;width:340px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto;display:none;z-index:6}
#panel.open{display:block}
#pname{font:600 20px Georgia,serif;background:none;border:0;border-bottom:1px dashed var(--line);color:var(--ink);width:calc(100% - 80px)}
#x,#mini{position:absolute;top:10px;padding:2px 9px}
#x{right:10px}
#mini{right:52px}
#meta{color:var(--mute);font-size:12px;margin:6px 0 10px}
textarea{width:100%;height:130px;background:#0a0c18;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px/1.5 Georgia,serif;resize:vertical}
.row{display:flex;gap:8px;margin:10px 0}
.row .main{flex:1}
#stats{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin:12px 0;font-size:14px}
#stats dt{color:var(--mute)}
#stats dd{margin:0;text-align:right}
.meter{height:5px;background:#1a1e33;border-radius:3px;grid-column:1/3;margin-top:-3px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:3px}
#notes{color:var(--mute);font-size:13px;line-height:1.5;margin:0}
#back{display:none}
body.in #back{display:inline-block}
body.in #rnd,body.in #zi,body.in #zo,body.in #x{display:none}
@media(max-width:600px){
  #panel{top:auto;height:62%;width:auto;left:12px}
  h1{width:100%}
  body.in #panel{height:44%}
  body.in textarea{height:64px}
}
#memory{max-height:210px;overflow:auto;font-size:13px} .memory-item{padding:8px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere} summary{cursor:pointer;margin:12px 0;color:#bcb0ff}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="bar">
  <h1>Worldwriter</h1>
  <button id="back" class="main">Back to space</button>
  <button id="rnd" class="main">Random world</button>
  <button id="zi" aria-label="Zoom in">+</button>
  <button id="zo" aria-label="Zoom out">−</button>
  <button id="save">Save file</button>
  <button id="load">Load file</button>
  <input id="file" type="file" accept=".json" hidden>
</div>

<div id="coord"></div>

<aside id="panel">
  <button id="mini" aria-label="Hide panel">▾</button>
  <button id="x" aria-label="Close">×</button>
  <input id="pname" aria-label="Planet name">
  <div id="meta"></div>
  <textarea id="story" placeholder="Write anything to create it. Try: 3 purple dragons, a castle, flying cars, or a chocolate mountain. Enter creates; Shift+Enter adds a new line."></textarea>
  <div class="row">
    <button id="enter" class="main">Enter planet</button>
    <button id="clear">Erase</button>
  </div>
  <button id="create" class="main" style="width:100%">Create · Enter ↵</button><p id="status" role="status" style="color:#bcb0ff;font-size:13px"></p><details open><summary>Planet memory</summary><div id="memory"></div></details><dl id="stats"></dl>
  <p id="notes"></p>
</aside>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const SEC=700,KEY='worldwriter-v2';
let W,H,DPR,cam={x:0,y:0,z:1},sel=null,vis=[];
let S={};

try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- procedural universe ---------- */
function hs(a,b,c){
  let x=(a*374761393+b*668265263+(c||0)*2147483647)|0;
  x=Math.imul(x^(x>>>13),1274126177);
  return(x^(x>>>16))>>>0;
}
function rng(seed){
  return()=>{
    seed|=0;seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

const SY=['ka','lo','mi','ra','zen','tar','vo','ul','sha','eri','no','qua','bel','dra','ix','om'];
function nameOf(r){
  let n='';
  for(let i=0,k=2+Math.floor(r()*2);i<k;i++)n+=SY[Math.floor(r()*SY.length)];
  return n[0].toUpperCase()+n.slice(1);
}

const cellCache=new Map();
function sector(sx,sy){
  const k=sx+','+sy;
  if(cellCache.has(k))return cellCache.get(k);

  const r=rng(hs(sx,sy,7)),out=[];
  let n=(sx===0&&sy===0)?2:(r()<.5?1:(r()<.3?2:0));

  for(let i=0;i<n;i++){
    const p={
      id:sx+':'+sy+':'+i,
      seed:hs(sx,sy,i+11),
      x:(sx+.15+r()*.7)*SEC,
      y:(sy+.15+r()*.7)*SEC,
      r:20+r()*38,
      hue:Math.floor(r()*360),
      ring:r()<.15,
      moons:Math.floor(r()*r()*3)
    };
    p.name=nameOf(r);
    out.push(p);
  }

  if(cellCache.size>600)cellCache.clear();
  cellCache.set(k,out);
  return out;
}

/* ---------- story -> planet traits ---------- */
const KW={
  water:/ocean|sea\b|water|river|lake|island|wave|tide/g,
  ice:/\bice|snow|cold|frozen|frost|winter|glacier/g,
  fire:/fire|lava|volcan|hot\b|burn|magma|flame|molten/g,
  forest:/forest|tree|jungle|green|grass|garden|plant|life|flower/g,
  desert:/desert|sand|dust|dry\b|dune/g,
  city:/city|cities|people|human|civiliz|town|kingdom|robot|village|alien|king|queen/g,
  gas:/\bgas|storm|jupiter|cloud world|windy/g,
  glow:/glow|crystal|magic|light|neon|shine|gold/g,
  ring:/\bring/g,
  moon:/moon/g,
  dark:/dark|night|shadow|black/g,
  rain:/\brain|drizzle|thunder|downpour/g
};

function analyze(s){
  const l=(s||'').toLowerCase(),T={};
  for(const k in KW){
    const m=l.match(KW[k]);
    T[k]=Math.min(3,m?m.length:0);
  }
  return T;
}

function stats(T,written){
  if(!written)return null;

  const cl=v=>Math.max(-90,Math.min(250,Math.round(v)));
  const cl100=v=>Math.max(0,Math.min(100,Math.round(v)));

  return{
    temp:cl(15+45*T.fire-50*T.ice+15*T.desert-4*T.water),
    water:cl100(T.water*30+T.ice*12-T.desert*25+(T.forest?10:0)),
    life:cl100(T.forest*28+T.water*14+T.city*20-T.fire*18-T.ice*8-T.desert*8+(T.city||T.forest?8:0)),
    civ:cl100(T.city*34+(T.glow?8:0))
  };
}

/* ---------- drawing: space view ---------- */
function blob(x,y,r,rn){
  ctx.beginPath();
  const n=8;
  for(let i=0;i<=n;i++){
    const a=i/n*6.283,rr=r*(.7+rn()*.5);
    ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr*.8);
  }
  ctx.closePath();
  ctx.fill();
}

function drawPlanet(p,x,y,r,t){
  const st=S[p.id],story=st&&st.story||'',T=analyze(story),written=story.trim().length>0,rn=rng(p.seed);

  let base;
  if(!written)base=`hsl(${p.hue},12%,38%)`;
  else if(T.gas)base='#c98b4a';
  else if(T.fire)base='#4a1710';
  else if(T.ice)base='#cfe6f2';
  else if(T.water)base='#1f5fa8';
  else if(T.desert)base='#c49a5a';
  else if(T.forest)base='#2f7a3a';
  else base=`hsl(${p.hue},30%,42%)`;

  const halo=T.fire?'255,110,40':T.glow?'200,170,255':T.water?'90,160,255':'';

  if(written&&halo){
    const g=ctx.createRadialGradient(x,y,r*.9,x,y,r*1.6);
    g.addColorStop(0,`rgba(${halo},.35)`);
    g.addColorStop(1,`rgba(${halo},0)`);
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(x,y,r*1.6,0,7);
    ctx.fill();
  }

  const ring=p.ring||T.ring,tilt=-.35;

  const drawRing=front=>{
    if(!ring)return;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(tilt);
    ctx.strokeStyle=T.ice?'rgba(220,240,255,.7)':'rgba(210,190,150,.55)';
    ctx.lineWidth=Math.max(1,r*.12);
    ctx.beginPath();
    ctx.ellipse(0,0,r*1.7,r*.45,0,front?0:Math.PI,front?Math.PI:Math.PI*2);
    ctx.stroke();
    ctx.restore();
  };

  drawRing(false);

  ctx.save();
  ctx.beginPath();
  ctx.arc(x,y,r,0,7);
  ctx.clip();

  ctx.fillStyle=base;
  ctx.fillRect(x-r,y-r,r*2,r*2);

  const drift=(t*.004)%1;

  if(written&&T.gas){
    for(let i=0;i<9;i++){
      ctx.fillStyle=`hsla(${25+rn()*25},${50+rn()*30}%,${40+rn()*25}%,.8)`;
      ctx.fillRect(x-r,y-r+i*r*.22+Math.sin(t*.001+i)*r*.02,r*2,r*.14);
    }
  }else if(written&&T.fire){
    ctx.strokeStyle='#ff7a2a';
    ctx.lineWidth=Math.max(1,r*.06);
    ctx.shadowColor='#ff5a10';
    ctx.shadowBlur=r*.2;

    for(let i=0;i<9;i++){
      ctx.beginPath();
      let a=x-r+rn()*r*2,b=y-r+rn()*r*2;
      ctx.moveTo(a,b);
      for(let k=0;k<4;k++){
        a+=(rn()-.5)*r*.7;
        b+=(rn()-.3)*r*.5;
        ctx.lineTo(a,b);
      }
      ctx.stroke();
    }
    ctx.shadowBlur=0;
  }else if(written){
    const land=T.forest?'#3f9a48':T.desert?'#d6b06c':'#7c6b55';

    if(T.water&&(T.forest||T.desert||T.city||!T.ice)){
      ctx.fillStyle=land;
      for(let i=0;i<4+T.forest*2;i++){
        const ox=(rn()*2-1+drift*2)%1.4;
        blob(x+ox*r,y+(rn()-.5)*r*1.4,r*(.18+rn()*.3),rn);
      }
    }else if(!T.water&&T.forest){
      ctx.fillStyle='#1f5a2a';
      for(let i=0;i<8;i++)blob(x+(rn()-.5)*r*1.8,y+(rn()-.5)*r*1.8,r*(.15+rn()*.3),rn);
    }else if(T.desert){
      ctx.fillStyle='#a87c3e';
      for(let i=0;i<7;i++)blob(x+(rn()-.5)*r*1.8,y+(rn()-.5)*r*1.8,r*(.15+rn()*.25),rn);
    }

    if(T.ice){
      ctx.fillStyle='rgba(245,250,255,.95)';
      ctx.fillRect(x-r,y-r,r*2,r*(.25+.18*T.ice));
      ctx.fillRect(x-r,y+r*(.75-.18*T.ice),r*2,r*.5);
    }

    if(T.water||T.gas){
      ctx.fillStyle='rgba(255,255,255,.35)';
      for(let i=0;i<5;i++){
        const ox=((rn()+drift*1.5)%1.3-.15)*2*r-r;
        ctx.beginPath();
        ctx.ellipse(x+ox,y+(rn()-.5)*r*1.6,r*.4,r*.07,0,0,7);
        ctx.fill();
      }
    }
  }else{
    ctx.fillStyle='rgba(255,255,255,.08)';
    for(let i=0;i<6;i++)blob(x+(rn()-.5)*r*1.6,y+(rn()-.5)*r*1.6,r*(.1+rn()*.2),rn);
  }

  if(T.dark){
    ctx.fillStyle='rgba(0,0,10,.35)';
    ctx.fillRect(x-r,y-r,r*2,r*2);
  }

  const sh=ctx.createRadialGradient(x-r*.45,y-r*.45,r*.1,x,y,r*1.15);
  sh.addColorStop(0,'rgba(255,255,255,.12)');
  sh.addColorStop(.55,'rgba(0,0,0,0)');
  sh.addColorStop(1,'rgba(0,0,8,.78)');
  ctx.fillStyle=sh;
  ctx.fillRect(x-r,y-r,r*2,r*2);

  if(written&&T.city){
    ctx.fillStyle='#ffd980';
    const n=8+T.city*10;
    for(let i=0;i<n;i++){
      const a=rn()*6.283,d=Math.sqrt(rn())*r*.8;
      if(Math.cos(a)>-.1)ctx.fillRect(x+Math.cos(a)*d+r*.15,y+Math.sin(a)*d,Math.max(1,r*.04),Math.max(1,r*.04));
    }
  }

  ctx.restore();
  drawRing(true);

  const mc=written&&T.moon?1+T.moon:p.mons||p.moons;
  for(let i=0;i<mc;i++){
    const a=t*.0006*(1+i*.4)+i*2,d=r*(1.5+i*.35);
    ctx.fillStyle='#b9b6c8';
    ctx.beginPath();
    ctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d*.35,Math.max(1.5,r*.12),0,7);
    ctx.fill();
  }

  if(sel&&sel.id===p.id){
    ctx.strokeStyle='rgba(155,140,255,.9)';
    ctx.lineWidth=1.5;
    ctx.setLineDash([4,5]);
    ctx.beginPath();
    ctx.arc(x,y,r*2.1,0,7);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if(r>14&&(st&&st.name!==p.name||written)){
    ctx.fillStyle='rgba(233,230,245,.8)';
    ctx.font='12px system-ui';
    ctx.textAlign='center';
    ctx.fillText((st&&st.name)||p.name,x,y+r*2.2+10);
  }
}

function stars(){
  for(const [f,sz,cell] of [[.15,1,110],[.35,1.6,170]]){
    const ox=cam.x*f*cam.z,oy=cam.y*f*cam.z;
    const x0=Math.floor(ox/cell),y0=Math.floor(oy/cell);

    for(let i=x0;i<x0+Math.ceil(W/cell)+2;i++){
      for(let j=y0;j<y0+Math.ceil(H/cell)+2;j++){
        const h=hs(i,j,3);
        if(h%3)continue;
        ctx.fillStyle=`rgba(255,255,255,${.25+(h%50)/100})`;
        ctx.fillRect(i*cell+(h%cell)-ox,j*cell+((h>>8)%cell)-oy,sz,sz);
      }
    }
  }
}

function frame(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);

  if(mode==='surface'){
    drawSurface(t);
    requestAnimationFrame(frame);
    return;
  }

  ctx.fillStyle='#05060f';
  ctx.fillRect(0,0,W,H);
  stars();
  vis=[];

  const z=cam.z;
  const x0=Math.floor((cam.x-W/2/z)/SEC)-1,x1=Math.floor((cam.x+W/2/z)/SEC)+1;
  const y0=Math.floor((cam.y-H/2/z)/SEC)-1,y1=Math.floor((cam.y+H/2/z)/SEC)+1;

  for(let a=x0;a<=x1;a++){
    for(let b=y0;b<=y1;b++){
      for(const p of sector(a,b)){
        const sx=(p.x-cam.x)*z+W/2,sy=(p.y-cam.y)*z+H/2,sr=p.r*z;
        if(sx<-sr*3||sx>W+sr*3||sy<-sr*3||sy>H+sr*3)continue;
        drawPlanet(p,sx,sy,sr,t);
        vis.push({p,sx,sy,sr});
      }
    }
  }

  $('coord').textContent=`x ${Math.round(cam.x)}  y ${Math.round(cam.y)}  zoom ${cam.z.toFixed(2)}`;
  requestAnimationFrame(frame);
}

function resize(){
  DPR=window.devicePixelRatio||1;
  W=innerWidth;
  H=innerHeight;
  cv.width=W*DPR;
  cv.height=H*DPR;
}
addEventListener('resize',resize);
resize();

/* ---------- navigation ---------- */
const ptr=new Map();
let moved=0;

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=0;
  cv.style.cursor='grabbing';
});

cv.addEventListener('pointermove',e=>{
  const o=ptr.get(e.pointerId);
  if(!o)return;

  const nx=e.clientX,ny=e.clientY;

  if(mode==='surface'){
    surf.x-=nx-o.x;
    moved+=Math.abs(nx-o.x);
    o.x=nx;
    o.y=ny;
    return;
  }

  if(ptr.size===2){
    const [a,b]=[...ptr.values()];
    const d0=Math.hypot(a.x-b.x,a.y-b.y);
    o.x=nx;o.y=ny;

    const [c,d]=[...ptr.values()];
    const d1=Math.hypot(c.x-d.x,c.y-d.y);

    if(d0>0)zoomBy(d1/d0,(c.x+d.x)/2,(c.y+d.y)/2);
    moved=99;
    return;
  }

  cam.x-=(nx-o.x)/cam.z;
  cam.y-=(ny-o.y)/cam.z;
  moved+=Math.abs(nx-o.x)+Math.abs(ny-o.y);
  o.x=nx;
  o.y=ny;
});

const up=e=>{
  if(mode==='space'&&ptr.size===1&&moved<6)pick(e.clientX,e.clientY);
  ptr.delete(e.pointerId);
  cv.style.cursor='grab';
};

cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));

function zoomBy(f,px,py){
  const nz=Math.max(.15,Math.min(4,cam.z*f));
  const wx=(px-W/2)/cam.z+cam.x,wy=(py-H/2)/cam.z+cam.y;
  cam.z=nz;
  cam.x=wx-(px-W/2)/nz;
  cam.y=wy-(py-H/2)/nz;
}

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomBy(e.deltaY<0?1.12:.89,e.clientX,e.clientY);
},{passive:false});

$('zi').onclick=()=>zoomBy(1.3,W/2,H/2);
$('zo').onclick=()=>zoomBy(.77,W/2,H/2);

function fly(p){
  const sx=cam.x,sy=cam.y,sz=cam.z,t0=performance.now();
  (function s(n){
    const k=Math.min(1,(n-t0)/900);
    const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    cam.x=sx+(p.x-sx)*e;
    cam.y=sy+(p.y-sy)*e;
    cam.z=sz+(1.6-sz)*e;
    if(k<1)requestAnimationFrame(s);
  })(t0);
}

$('rnd').onclick=()=>{
  for(let i=0;i<200;i++){
    const sx=Math.floor((Math.random()-.5)*2000),sy=Math.floor((Math.random()-.5)*2000);
    const l=sector(sx,sy);
    if(l.length){
      fly(l[0]);
      open(l[0]);
      return;
    }
  }
};

/* ---------- planet panel ---------- */
function pick(x,y){
  let best=null;
  for(const v of vis){
    const d=Math.hypot(v.sx-x,v.sy-y);
    if(d<=Math.max(v.sr*1.4,18)&&(!best||d<best.d))best={v,d};
  }
  if(best)open(best.v.p);
  else close();
}

function open(p){
  sel=p;
  const st=S[p.id]||{};
  $('pname').value=st.name||p.name;
  $('story').value='';
  $('meta').textContent=`Sector ${p.id.split(':').slice(0,2).join(', ')} · planet ${+p.id.split(':')[2]+1}`;
  $('status').textContent='';
  $('panel').classList.add('open');
  refresh();
}

function close(){
  sel=null;
  $('panel').classList.remove('open');
}

function save(){
  if(!sel)return;
  const st=S[sel.id]||{story:'',memories:[],objects:[]};
  st.name=$('pname').value.trim()||sel.name;
  S[sel.id]=st;
  persist();refresh();
}

function refresh(){
  if(!sel)return;

  renderMemory();
  const story=(S[sel.id]||{}).story||'';
  const T=analyze(story),s=stats(T,story.trim());
  const dl=$('stats');
  dl.innerHTML='';

  if(!s){
    $('notes').textContent='This world is unwritten. Write anything and press Enter to create it.';
    return;
  }

  const add=(k,v,pct)=>{
    dl.insertAdjacentHTML('beforeend',
      `<dt>${k}</dt><dd>${v}</dd>`+
      (pct!=null?`<div class="meter"><i style="width:${pct}%"></i></div>`:'')
    );
  };

  add('Temperature',s.temp+' °C');
  add('Surface water',s.water+'%',s.water);
  add('Life',s.life+'%',s.life);
  add('Civilization',s.civ+'%',s.civ);

  const hit=Object.keys(T).filter(k=>T[k]).join(', ');
  $('notes').textContent=hit
    ?`Your words activated: ${hit}. Use more of a word to make its effect stronger.`
    :'Your words are saved as custom creations. Enter the planet to see them.';
}

$('x').onclick=close;

$('clear').onclick=()=>{
  if(!sel)return;
  if(mode!=='surface'){$('status').textContent='Enter this planet first, then press Erase to clear its memory.';return;}
  if(!confirm('Erase ALL creations, memories, and the custom name on this planet? Other planets will not change.'))return;
  delete S[sel.id];persist();
  $('story').value='';$('pname').value=sel.name;
  tgt=analyze('');cur={};for(const k of KEYS)cur[k]=0;
  evts=[];surf.x=0;refresh();
  $('status').textContent='This planet’s creations and memory have been erased.';
};

$('pname').addEventListener('change',save);

/* ---------- export / import ---------- */
$('save').onclick=()=>{

  a.download='worldwriter-universe.json';

$('load').onclick=()=>$('file').click();

$('file').onchange=e=>{

    }
  });
};

/* ---------- inside the planet ---------- */
let mode='space',surf={x:0},cur={},tgt={},evts=[];

const KEYS=Object.keys(KW);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;

function hsl(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return[f(0)*255,f(8)*255,f(4)*255];
}

const rk=(i,s)=>hs(i,s,5)/4294967296;
const ter=(x,s,a)=>Math.sin(x*.004+s)*a+Math.sin(x*.011+s*2.3)*a*.5+Math.sin(x*.027+s*4.1)*a*.2;

const MSG={
  water:['Oceans fill the lowlands','The seas recede'],
  ice:['The air freezes and ice spreads','The ice melts away'],
  fire:['The ground splits and lava rises','The fires die down'],
  forest:['Forests take root','The forests wither'],
  desert:['Sand swallows the land','The sand settles'],
  city:['A city rises from the ground','The city empties'],
  gas:['Heavy storm clouds roll in','The storm clouds clear'],
  glow:['Crystals begin to glow','The glow fades'],
  dark:['Night falls','Dawn breaks'],
  moon:['A new moon rises','A moon sets'],
  ring:['A ring forms in the sky','The ring dissolves'],
  rain:['Rain begins to fall','The rain stops']
};

function enter(){
  if(!sel)return;
  mode='surface';
  surf.x=0;

  tgt=analyze((S[sel.id]||{}).story);
  const st=S[sel.id]||{};if(st.memories?.length)tgt.city=Math.max(tgt.city,Math.min(3,st.memories.length));
  cur={};
  for(const k of KEYS)cur[k]=0;

  evts=[];
  document.body.classList.add('in');
}

function leave(){
  mode='space';
  document.body.classList.remove('in');
  if(sel){
    cam.x=sel.x;
    cam.y=sel.y;
    cam.z=1.6;
  }
}

$('enter').onclick=enter;
$('back').onclick=leave;

let saveTimer=null;

$('story').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submitCreation();}
});
$('create').onclick=submitCreation;

/* keyboard controls */
const keys={};

addEventListener('keydown',e=>{
  if(e.target.matches('textarea,input')||e.isComposing)return;
  keys[e.key.toLowerCase()]=true;
  if(e.key==='Escape'&&mode==='surface')leave();
});

addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
});

(function walkLoop(){
  if(mode==='surface'){
    const sp=keys['shift']?7:3.5;
    if(keys['arrowleft']||keys['a'])surf.x-=sp;
    if(keys['arrowright']||keys['d'])surf.x+=sp;
  }
  requestAnimationFrame(walkLoop);
})();

/* double-click / double-tap a planet to enter it */
let lastTap=0;

cv.addEventListener('dblclick',e=>{
  if(mode!=='space')return;

  let best=null;
  for(const v of vis){
    const d=Math.hypot(v.sx-e.clientX,v.sy-e.clientY);
    if(d<=Math.max(v.sr*1.4,18)&&(!best||d<best.d))best={v,d};
  }

  if(best){
    open(best.v.p);
    enter();
  }
});

/* panel minimize button */
$('mini').onclick=()=>{
  const p=$('panel');
  p.style.height=p.style.height==='44px'?'':'44px';
};

/* ---------- surface drawing ---------- */
function drawSurface(t){
  const p=sel;
  if(!p){
    leave();
    return;
  }

  const SH=W<600?H*.55:H,hz=SH*.55;
  const seed=(p.seed%1000)/100;
  const v=k=>clamp(cur[k]/3,0,1);
  const story=(S[p.id]||{}).story||'';

  for(const k of KEYS)cur[k]+=((tgt[k]||0)-cur[k])*.035;
  surf.x+=.25;

  /* sky */
  let top=hsl(p.hue,35,14),bot=hsl(p.hue,30,36);

  const sk=(k,a,b,w)=>{
    const m=v(k)*w;
    top=mixc(top,a,m);
    bot=mixc(bot,b,m);
  };

  sk('forest',[50,120,190],[170,220,230],.7);
  sk('water',[40,90,170],[150,200,240],.8);
  sk('desert',[190,120,70],[240,200,140],.85);
  sk('ice',[120,160,200],[225,240,250],.85);
  sk('gas',[120,60,30],[230,150,70],.85);
  sk('fire',[60,10,10],[210,70,30],.9);
  sk('glow',[60,30,110],[130,90,200],.5);
  sk('dark',[3,4,12],[14,14,36],.95);

  const g=ctx.createLinearGradient(0,0,0,hz+40);
  g.addColorStop(0,rgb(top));
  g.addColorStop(1,rgb(bot));
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* stars */
  const sa=.2+v('dark')*.7+v('fire')*.1;

  for(let i=0;i<130;i++){
    const h=hs(i,9,1);
    ctx.fillStyle=`rgba(255,255,255,${sa*(.4+.6*Math.abs(Math.sin(t*.001+i)))})`;
    ctx.fillRect(h%W,(h>>>8)%(hz*.9),1.5,1.5);
  }

  /* sun */
  const sx=W*.68,sy=hz-SH*.28,sa2=1-v('dark')*.95;

  if(sa2>.02){
    const r=26+v('fire')*34;
    const c=mixc(mixc([255,232,170],[255,255,245],v('ice')),[255,110,40],v('fire'));
    const cs=`${c[0]|0},${c[1]|0},${c[2]|0}`;
    const gg=ctx.createRadialGradient(sx,sy,r*.3,sx,sy,r*5);

    gg.addColorStop(0,`rgba(${cs},${.55*sa2})`);
    gg.addColorStop(1,`rgba(${cs},0)`);

    ctx.fillStyle=gg;
    ctx.fillRect(0,0,W,hz+80);

    ctx.fillStyle=`rgba(${cs},${sa2})`;
    ctx.beginPath();
    ctx.arc(sx,sy,r,0,7);
    ctx.fill();
  }

  /* moons */
  const mn=p.moons+(cur.moon>.05?1+cur.moon:0);

  for(let i=0;i<5;i++){
    const a=clamp(mn-i,0,1);
    if(a<=0)continue;

    const r=12+rk(i,3)*16;
    const x=((W*(.15+.17*i)+t*.004*(1+i*.3)-surf.x*.03)%(W+100)+W+100)%(W+100)-50;
    const y=SH*(.12+.07*i)+Math.sin(t*.0003+i)*6;

    const mg=ctx.createRadialGradient(x-r*.4,y-r*.4,r*.1,x,y,r);
    mg.addColorStop(0,'#f0eef8');
    mg.addColorStop(1,'#8d8aa6');

    ctx.globalAlpha=a;
    ctx.fillStyle=mg;
    ctx.beginPath();
    ctx.arc(x,y,r,0,7);
    ctx.fill();
    ctx.globalAlpha=1;
  }

  /* ring */
  const ra=p.ring?1:v('ring');

  if(ra>.02){
    ctx.save();
    ctx.globalAlpha=ra*.7;
    ctx.translate(W*.5,hz+SH*.5);
    ctx.rotate(-.18);

    for(const [rx,ry,lw,c] of [
      [W*.95,SH*.75,26,'rgba(215,195,160,.55)'],
      [W*1,SH*.79,8,'rgba(235,220,190,.5)'],
      [W*.88,SH*.7,5,'rgba(170,150,120,.5)']
    ]){
      ctx.strokeStyle=c;
      ctx.lineWidth=lw;
      ctx.beginPath();
      ctx.ellipse(0,0,rx,ry,0,Math.PI*1.08,Math.PI*1.92);
      ctx.stroke();
    }

    ctx.restore();
  }

  /* clouds */
  const cd=clamp(.18+v('water')*.35+v('gas')*.8+v('rain')*.4,0,1);
  const cc=mixc(mixc([255,255,255],[80,70,80],v('fire')),[230,170,110],v('gas')*.6);

  for(let i=0;i<9;i++){
    if(i/9>cd)break;

    const sp=.006+rk(i,4)*.01;
    const x=(((rk(i,5)*W+t*sp-surf.x*.12)%(W+300))+W+300)%(W+300)-150;
    const y=SH*(.08+rk(i,6)*.3);
    const s=60+rk(i,7)*90;

    ctx.fillStyle=`rgba(${cc[0]|0},${cc[1]|0},${cc[2]|0},${.25+cd*.35})`;

    for(const [dx,dy,k] of [[0,0,1],[s*.5,-s*.1,.75],[-s*.5,s*.05,.7]]){
      ctx.beginPath();
      ctx.ellipse(x+dx,y+dy,s*k,s*.28*k,0,0,7);
      ctx.fill();
    }
  }

  /* terrain */
  const ground=mixc(
    mixc(
      mixc(
        mixc(
          mixc(hsl(p.hue,15,30),[196,154,90],v('desert')*.9),
          [44,110,50],v('forest')*.9
        ),
        [235,245,250],v('ice')*.9
      ),
      [40,22,20],v('fire')*.9
    ),
    [8,9,18],v('dark')*.55
  );

  const haze=(c,a)=>mixc(c,bot,a);

  const ridge=(par,base,amp,s,ab)=>x=>base+(ab?-Math.abs(ter(x+surf.x*par,s,amp)):ter(x+surf.x*par,s,amp));

  const fillRidge=(f,fill)=>{
    ctx.beginPath();
    ctx.moveTo(0,H);
    for(let x=0;x<=W+8;x+=8)ctx.lineTo(x,f(x));
    ctx.lineTo(W+8,H);
    ctx.closePath();
    ctx.fillStyle=fill;
    ctx.fill();
  };

  const mc=haze(mixc(hsl(p.hue,20,22),[60,20,20],v('fire')*.7),.45);
  const gf=ctx.createLinearGradient(0,hz-SH*.25,0,hz+10);

  gf.addColorStop(0,rgb(haze(mixc(mc,[245,250,255],v('ice')*.9),.3)));
  gf.addColorStop(.5,rgb(mc));
  gf.addColorStop(1,rgb(mc));

  fillRidge(ridge(.2,hz+10,SH*.14,seed,true),gf);
  fillRidge(ridge(.5,hz+SH*.07,SH*.04,seed+3,false),rgb(haze(ground,.35)));

  /* city */
  if(cur.city>.03){
    const cw=44,par=.7;
    const i0=Math.floor(surf.x*par/cw)-1,n=Math.ceil(W/cw)+3;
    const by=hz+SH*.075,bc=rgb(mixc([16,18,34],bot,.22));

    for(let i=i0;i<i0+n;i++){
      const rn=rk(i,21);
      const cl=.5+.5*Math.sin(i*.07+seed);
      const dens=v('city')*1.1+cl*.25-.15;

      if(dens<=rn)continue;

      const s=clamp((dens-rn)*4,0,1);
      const bw=22+rk(i,22)*26;
      const bh=(30+rk(i,23)*150*(.4+v('city')))*SH/700*s;
      const x=i*cw+rk(i,24)*10-surf.x*par;

      ctx.fillStyle=bc;
      ctx.fillRect(x,by-bh,bw,bh);

      for(let r=0;r<bh-8;r+=9){
        for(let c=0;c<bw-6;c+=7){
          if(hs(i,r*9+c,31)%5<2){
            ctx.fillStyle=`rgba(255,217,138,${.55+.4*Math.sin(t*.002+r+c+i)*Math.sin(i)})`;
            ctx.fillRect(x+4+c,by-bh+4+r,3,4);
          }
        }
      }

      if(v('glow')>.3){
        ctx.shadowColor='#6ff';
        ctx.shadowBlur=8;
        ctx.fillStyle='#8ff';
        ctx.fillRect(x,by-bh,bw,2);
        ctx.shadowBlur=0;
      }

      if(bh>90*SH/700){
        ctx.fillStyle=bc;
        ctx.fillRect(x+bw/2,by-bh-14,1.5,14);

        if(Math.sin(t*.004+i)>0){
          ctx.fillStyle='#f55';
          ctx.fillRect(x+bw/2-1,by-bh-16,3.5,3.5);
        }
      }
    }
  }

  /* ground */
  const gy=ridge(1,hz+SH*.17,SH*.035,seed+7,false);
  fillRidge(gy,rgb(ground));

  const sh=ctx.createLinearGradient(0,hz+SH*.1,0,H);
  sh.addColorStop(0,'rgba(0,0,0,0)');
  sh.addColorStop(1,'rgba(0,0,0,.32)');
  ctx.fillStyle=sh;
  ctx.fillRect(0,hz+SH*.1,W,H);

  /* water */
  const yw=hz+SH*.25-v('water')*SH*.17;
  const fz=v('ice');
  const wt=mixc([70,150,210],[200,230,245],fz);
  const wb=mixc([15,60,130],[150,190,215],fz);

  if(cur.water>.03){
    const wg=ctx.createLinearGradient(0,yw,0,H);
    wg.addColorStop(0,rgb(wt));
    wg.addColorStop(1,rgb(wb));

    const subs=[];

    for(let x=0;x<=W;x+=8){
      const d=gy(x)-yw;
      if(d>0){
        const a=clamp(d/(SH*.02),0,1)*.94;
        subs.push(x);
        ctx.globalAlpha=a;
        ctx.fillStyle=wg;
        ctx.fillRect(x,yw,8.5,H-yw);
      }
    }

    ctx.globalAlpha=1;

    if(fz<.85){
      ctx.strokeStyle=`rgba(255,255,255,${.28*(1-fz)})`;
      ctx.lineWidth=1;
      ctx.beginPath();

      for(let j=0;j<7;j++){
        const y0=yw+(j+1)*(j+1)*SH*.012;
        if(y0>H)break;

        for(const x of subs){
          ctx.moveTo(x,y0+Math.sin(x*.03+t*.002+j)*2);
          ctx.lineTo(x+8,y0+Math.sin((x+8)*.03+t*.002+j)*2);
        }
      }

      ctx.stroke();
    }
  }

  const dry=y=>!(cur.water>.03&&y>yw);

  /* life on the ground */
  const cw=64;
  const i0=Math.floor(surf.x/cw)-1,n=Math.ceil(W/cw)+3;
  const dF=v('forest'),dD=v('desert'),dG=v('glow'),dI=fz,fr=v('fire');

  for(let i=i0;i<i0+n;i++){
    const x=i*cw+rk(i,40)*40-surf.x,y=gy(x);
    if(!dry(y))continue;

    let s=clamp((dF*1.05-rk(i,41))*4,0,1);

    if(s>0){
      const h=(36+rk(i,44)*52)*SH/700*s;
      const sw=Math.sin(t*.0015+i)*2;
      const gc=mixc(mixc([34+rk(i,45)*25,112+rk(i,46)*40,52],[26,80,70],dI),[45,28,22],fr*.8);

      ctx.fillStyle='#3b2a1c';
      ctx.fillRect(x-2,y-h*.4,4,h*.4);
      ctx.fillStyle=rgb(gc);

      if(dI>.45){
        for(let k=0;k<3;k++){
          const ty=y-h*(.25+k*.25),tw=h*(.34-k*.08),tx=x+sw*(k+1)*.4;
          ctx.beginPath();
          ctx.moveTo(tx-tw,ty);
          ctx.lineTo(tx,ty-h*.34);
          ctx.lineTo(tx+tw,ty);
          ctx.fill();
        }
      }else{
        ctx.beginPath();
        ctx.ellipse(x+sw,y-h*.62,h*.3,h*.38,0,0,7);
        ctx.fill();

        ctx.fillStyle='rgba(255,255,255,.1)';
        ctx.beginPath();
        ctx.ellipse(x+sw-h*.08,y-h*.7,h*.15,h*.2,0,0,7);
        ctx.fill();
      }
    }

    s=clamp((dD*.5-rk(i,42))*4,0,1);

    if(s>0){
      const h=(30+rk(i,47)*40)*SH/700*s;
      ctx.fillStyle='#4a8a58';
      ctx.fillRect(x-4,y-h,8,h);
      ctx.fillRect(x-14,y-h*.6,10,4);
      ctx.fillRect(x-14,y-h*.6-14*s,4,14*s);
      ctx.fillRect(x+4,y-h*.45,10,4);
      ctx.fillRect(x+10,y-h*.45-12*s,4,12*s);
    }

    s=clamp((dG*.6-rk(i,43))*4,0,1);

    if(s>0){
      const h=(28+rk(i,48)*50)*SH/700*s;
      ctx.shadowColor='#a58bff';
      ctx.shadowBlur=8;
      ctx.fillStyle='rgba(170,140,255,.85)';
      ctx.beginPath();
      ctx.moveTo(x-9,y);
      ctx.lineTo(x-2,y-h);
      ctx.lineTo(x+9,y);
      ctx.fill();

      ctx.fillStyle='rgba(140,230,255,.8)';
      ctx.beginPath();
      ctx.moveTo(x+4,y);
      ctx.lineTo(x+13,y-h*.6);
      ctx.lineTo(x+20,y);
      ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  /* lava */
  if(fr>.03){
    const lw=180,l0=Math.floor(surf.x/lw)-1;

    for(let i=l0;i<l0+Math.ceil(W/lw)+3;i++){
      const s=clamp((fr-rk(i,51))*4,0,1);
      if(s<=0)continue;

      const x=i*lw+rk(i,52)*100-surf.x,y=gy(x)+8;
      if(!dry(y))continue;

      ctx.shadowColor='#ff5a10';
      ctx.shadowBlur=12*s;
      ctx.fillStyle=`rgba(255,${110+Math.sin(t*.004+i)*30|0},30,${.9*s})`;
      ctx.beginPath();
      ctx.ellipse(x,y,70*s,9*s,0,0,7);
      ctx.fill();
      ctx.shadowBlur=0;
    }

    for(let i=0;i<Math.floor(70*fr);i++){
      const life=(t*.03*(.5+rk(i,62))+rk(i,63)*SH)%SH;
      ctx.fillStyle=`rgba(255,${120+rk(i,64)*100|0},40,${1-life/SH})`;
      ctx.fillRect(hs(i,61,1)%W+Math.sin(t*.002+i)*14,hz+SH*.2-life*1.1,2,2);
    }
  }

  /* weather */
  if(dI>.03){
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(let i=0;i<Math.floor(160*dI);i++){
      ctx.fillRect(
        hs(i,71,1)%W+Math.sin(t*.001+i)*25,
        ((hs(i,72,1)%SH)+t*(.03+rk(i,73)*.05))%SH,
        2.2,2.2
      );
    }
  }

  const rn2=clamp(cur.rain/2,0,1);

  if(rn2>.03){
    ctx.strokeStyle='rgba(190,210,255,.45)';
    ctx.lineWidth=1;
    ctx.beginPath();

    for(let i=0;i<Math.floor(170*rn2);i++){
      const x=hs(i,81,1)%W,y=((hs(i,82,1)%SH)+t*.6)%SH;
      ctx.moveTo(x,y);
      ctx.lineTo(x-3,y+14);
    }

    ctx.stroke();
  }

  if(dD>.03){
    ctx.fillStyle='rgba(230,190,130,.25)';
    for(let i=0;i<Math.floor(60*dD);i++){
      ctx.fillRect(
        (hs(i,91,1)%W+t*.25*(1+rk(i,92)))%W,
        SH*.45+(hs(i,93,1)>>>6)%(SH*.4),
        30,1.5
      );
    }
  }

  const ph=t%8000;

  if((cur.rain>1.2||cur.gas>1.5)&&(ph<110||(ph>200&&ph<260))){
    ctx.fillStyle='rgba(255,255,255,.22)';
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    ctx.beginPath();

    let bx=W*(.2+rk(Math.floor(t/8000),5)*.6),by2=0;
    ctx.moveTo(bx,by2);

    while(by2<hz){
      bx+=(Math.random()-.5)*40;
      by2+=30;
      ctx.lineTo(bx,by2);
    }

    ctx.stroke();
  }

  drawCreations(t,SH,hz,gy);

  /* captions */
  evts=evts.filter(e=>t-e.t<4200);
  const cx=W<600?W/2:(W-340)/2;

  ctx.textAlign='center';
  ctx.font='italic 20px Georgia,serif';

  evts.slice(-3).forEach((e,j)=>{
    const age=t-e.t;
    const al=clamp(Math.min(age/300,(4200-age)/900),0,1);

    ctx.shadowColor='rgba(0,0,0,.7)';
    ctx.shadowBlur=8;
    ctx.fillStyle=`rgba(255,255,255,${al})`;
    ctx.fillText(e.m,cx,76+j*28);
    ctx.shadowBlur=0;
  });

  if(!story.trim()&&!evts.length){
    ctx.font='italic 18px Georgia,serif';
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.fillText('A bare world. Write anything and press Enter. Drag or use A/D to walk.',cx,SH*.3);
  }

  $('coord').textContent='Standing on '+(((S[p.id]||{}).name)||p.name);
}


const TYPES=[
 ['dragon',/dragon|dinosaur|monster|godzilla/i],['animal',/cat|dog|wolf|lion|tiger|horse|unicorn|elephant|rabbit|pet\b/i],
 ['bird',/bird|eagle|butterfly|phoenix/i],['person',/person|people|human|alien|robot|wizard|fairy|zombie/i],
 ['vehicle',/car\b|cars\b|bus\b|truck|train|bike|motorcycle/i],['spaceship',/spaceship|rocket|ufo|airplane|plane\b|helicopter/i],
 ['castle',/castle|palace|fortress/i],['building',/house|home|tower|building|shop|school|hospital|stadium|factory/i],
 ['bridge',/bridge/i],['mountain',/mountain|volcano|hill/i],['tree',/tree|flower|mushroom/i],
 ['food',/cake|chocolate|pizza|candy|ice cream|food/i],['portal',/portal|wormhole|black hole/i]
];
const COLORS={red:'#ff6464',orange:'#ffad55',yellow:'#ffe76c',green:'#73e89a',blue:'#6cbdff',purple:'#ba8cff',pink:'#ff99d4',white:'#f5f5ff',black:'#343445',gold:'#ffd16c',silver:'#ccd9e9',brown:'#ab7657'};
function textHash(text){let n=2166136261;for(const c of text)n=Math.imul(n^c.codePointAt(0),16777619);return n>>>0;}
function makeObjects(text,origin){
 const parts=text.split(/\n|;|,|\band\b/i).map(x=>x.trim()).filter(Boolean),out=[];
 parts.forEach((label,j)=>{
  const type=(TYPES.find(x=>x[1].test(label))||['custom'])[0];
  const number=label.match(/\b(\d+)\b/),word=label.match(/\b(one|two|three|four|five|six|seven|eight|nine|ten)\b/i);
  const count=Math.max(1,Math.min(50,number?+number[1]:word?['one','two','three','four','five','six','seven','eight','nine','ten'].indexOf(word[1].toLowerCase())+1:1));
  const colorName=Object.keys(COLORS).find(c=>new RegExp('\\b'+c+'\\b','i').test(label));
  for(let i=0;i<count;i++)out.push({label,type,color:colorName?COLORS[colorName]:`hsl(${textHash(label)%360},75%,70%)`,x:origin+80+out.length*115,seed:textHash(label+i),flying:/fly|flying|float|sky|hover/i.test(label)||['bird','spaceship'].includes(type),size:/giant|huge|big/i.test(label)?1.6:/tiny|small/i.test(label)?.65:1});
 });return out;
}
function renderMemory(){
 const box=$('memory');box.replaceChildren();
 const st=S[sel.id]||{};
 const memories=Array.isArray(st.memories)?st.memories:(st.story?[{text:st.story}]:[]);
 if(!memories.length){box.textContent='No memories yet.';return;}
 memories.forEach((m,i)=>{const el=document.createElement('div');el.className='memory-item';el.textContent=(i+1)+'. '+m.text;box.append(el);});
}
function submitCreation(){
 if(!sel)return;
 const text=$('story').value.trim();if(!text)return;
 const previous=S[sel.id];
 const st=previous?JSON.parse(JSON.stringify(previous)):{name:$('pname').value.trim()||sel.name,story:'',memories:[],objects:[]};
 if(!Array.isArray(st.memories))st.memories=st.story?[{text:st.story}]:[];
 if(!Array.isArray(st.objects))st.objects=st.story?makeObjects(st.story,0):[];
 st.memories.push({text,time:Date.now()});st.story=(st.story?st.story+'\n':'')+text;
 const added=makeObjects(text,mode==='surface'?surf.x:st.objects.length*115);
 st.objects.push(...added);
 try{const next={...S,[sel.id]:st};localStorage.setItem(KEY,JSON.stringify(next));S=next;}
 catch(e){$('status').textContent='Browser storage is full or unavailable. Nothing was submitted. Save a backup or free storage and try again.';return;}
 tgt=analyze(st.story);
 // Every submission adds life to the city, including previously unknown words.
 tgt.city=Math.max(tgt.city,Math.min(3,st.memories.length));
 $('story').value='';refresh();
 $('status').textContent=`Created ${added.length} object${added.length===1?'':'s'} and saved your words in this planet’s memory.`;
 if(mode==='surface')evts.push({t:performance.now(),m:'Your creation has arrived'});
}
function drawCreations(t,SH,hz,gy){
 const st=S[sel.id]||{};
 const objects=Array.isArray(st.objects)?st.objects:(st.story?makeObjects(st.story,0):[]);
 for(const o of objects){
  const x=o.x-surf.x;if(x < -220 || x>W+220)continue;
  const y=o.flying?hz-65+Math.sin(t*.001+o.seed)*18:gy(x)-5;
  ctx.save();ctx.translate(x,y);ctx.scale(o.size||1,o.size||1);
  ctx.fillStyle=o.color;ctx.strokeStyle=o.color;ctx.lineWidth=3;
  const circle=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();};
  const poly=points=>{ctx.beginPath();points.forEach(([a,b],i)=>ctx[i?'lineTo':'moveTo'](a,b));ctx.closePath();ctx.fill();};
  switch(o.type){
   case 'dragon':case 'animal':circle(0,-23,19);circle(25,-39,12);ctx.fillRect(-17,-12,8,15);ctx.fillRect(9,-12,8,15);poly([[-17,-25],[-48,-44],[-30,-12]]);if(o.type==='dragon'){poly([[0,-33],[-25,-78],[26,-47]]);poly([[29,-47],[30,-61],[38,-46]]);}break;
   case 'bird':poly([[-3,-20],[-45,-42],[-21,-10],[0,-15],[23,-8],[44,-42],[7,-20]]);circle(0,-20,7);break;
   case 'person':circle(0,-49,11);ctx.fillRect(-9,-34,18,23);ctx.fillRect(-12,-13,7,15);ctx.fillRect(5,-13,7,15);ctx.fillRect(-21,-31,42,6);break;
   case 'vehicle':ctx.fillRect(-35,-25,70,19);poly([[-23,-25],[-13,-44],[19,-44],[30,-25]]);ctx.fillStyle='#171827';circle(-22,-6,9);circle(23,-6,9);break;
   case 'spaceship':ctx.beginPath();ctx.ellipse(0,-20,43,12,0,0,7);ctx.fill();circle(0,-31,17);ctx.fillStyle='#d9f8ff';circle(0,-32,9);break;
   case 'castle':ctx.fillRect(-32,-55,64,55);ctx.fillRect(-45,-78,20,78);ctx.fillRect(25,-78,20,78);for(let k=-45;k<46;k+=15)ctx.fillRect(k,-84,8,12);ctx.fillStyle='#16172c';ctx.fillRect(-10,-25,20,25);break;
   case 'building':ctx.fillRect(-28,-85,56,85);ctx.fillStyle='#fff4b5';for(let a=-18;a<24;a+=15)for(let b=-72;b<-15;b+=18)ctx.fillRect(a,b,7,9);break;
   case 'bridge':ctx.strokeRect(-55,-30,110,8);ctx.fillRect(-48,-22,7,25);ctx.fillRect(41,-22,7,25);break;
   case 'mountain':poly([[-60,0],[0,-110],[60,0]]);ctx.fillStyle='#f0f3ff';poly([[-15,-83],[0,-110],[16,-82]]);break;
   case 'tree':ctx.fillRect(-4,-50,8,50);circle(0,-60,30);circle(-20,-45,18);circle(20,-45,18);break;
   case 'food':ctx.fillRect(-30,-38,60,38);ctx.fillStyle='#fff0d6';ctx.fillRect(-30,-43,60,12);circle(-17,-43,6);circle(15,-43,6);break;
   case 'portal':ctx.shadowColor=o.color;ctx.shadowBlur=20;ctx.beginPath();ctx.ellipse(0,-43,26,43,0,0,7);ctx.stroke();break;
   default:poly([[0,-66],[32,-35],[0,-5],[-32,-35]]);ctx.fillStyle='#ffffff';circle(0,-35,7);
  }
  ctx.shadowBlur=0;ctx.font='12px system-ui';ctx.textAlign='center';
  const label=o.label.length>45?o.label.slice(0,42)+'…':o.label;
  const tw=ctx.measureText(label).width;ctx.fillStyle='rgba(5,6,15,.8)';ctx.fillRect(-tw/2-5,10,tw+10,20);ctx.fillStyle='#f6f2ff';ctx.fillText(label,0,24);ctx.restore();
 }
}

requestAnimationFrame(frame);
